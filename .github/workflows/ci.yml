name: CI


on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 工具链：CDN 只提供 `binaries/latest/...`（带版本号的路径一律 403，实测
# 0.1.20261119 / 0.1.20261021 都是），所以没法按版本号钉死，只能把「装到的那
# 一份」缓存住。**改下面这个日期就是升级动作**：缓存键变化 → 重新装 latest →
# 存成新缓存。
# 为什么要冻结：上游新增的弃用诊断会让 `--deny-warn` 在零代码改动时变红
# （0.1.6 就是这么红的）。缓存 7 天不活跃会被清掉，那时自动回到 latest——
# 版本号变化会以 notice 打出来，不静默。
env:
  TOOLCHAIN_STAMP: "2026-11-25"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache MoonBit toolchain
        id: moon-cache
        uses: actions/cache@v4
        with:
          # 只缓存工具链本身：`registry/`（下载缓存）不进来，`credentials.json`
          # 是 moon home 根下的文件，也不在列表里——别让它有机会进缓存。
          path: |
            ~/.moon/bin
            ~/.moon/lib
            ~/.moon/include
            ~/.moon/share
          key: moon-${{ runner.os }}-${{ env.TOOLCHAIN_STAMP }}

      - name: Install MoonBit
        if: steps.moon-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- latest

      # 命中缓存时不会执行上一步，PATH 得单独加；同一 step 里追加 GITHUB_PATH
      # 对当前 step 不生效，所以必须是独立 step。
      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon version
        run: |
          v=$(moon version --all 2>&1 | tr '\n' ' ')
          printf '%s\n' "$v"
          echo "::notice::moon: $v  (stamp=$TOOLCHAIN_STAMP, cache-hit=${{ steps.moon-cache.outputs.cache-hit }})"

      - name: check
        run: |
          if ! out=$(moon check --deny-warn 2>&1); then
            printf '%s\n' "$out"
            msg=$(printf '%s' "$out" | tr -d '%' | tr '\n' '|' | head -c 3000)
            echo "::error::moon check failed: $msg"
            exit 1
          fi

      - name: fmt
        run: |
          if ! out=$(moon fmt --check 2>&1); then
            printf '%s\n' "$out"
            msg=$(printf '%s' "$out" | tr -d '%' | tr '\n' '|' | head -c 3000)
            echo "::error::moon fmt failed: $msg"
            exit 1
          fi

      # 三个后端都跑同一套测试：网格指纹是写死的常量，后端间出现任何
      # 浮点差异或遍历顺序差异都会在这里炸。
      - name: test native
        run: moon test --target native

      - name: test wasm-gc
        run: moon test --target wasm-gc

      - name: test js
        run: moon test --target js

      - name: build native
        run: moon build --target native

      - name: package
        run: moon package

      # 浏览器验收壳：同一份 wasm 在 Node 里实例化并跑 selftest。
      # 走 build_web.mjs 而不是直接 `moon build`：它知道产物的两种目录层级
      # （单模块仓库 / workspace 成员），并把 wasm 复制到固定位置，下面的
      # 检查就不用猜路径了。
      - name: wasm selftest
        run: |
          node tools/build_web.mjs
          node tools/wasm_check.mjs examples/web/web.wasm

      # 交互 demo 的 wasm 接口：建网格、读坐标、读指标。浏览器里 canvas
      # 干的就是这些事，这里过了说明页面不会因为接口断掉而白屏。
      - name: wasm scene
        run: node tools/scene_check.mjs examples/web/web.wasm

      - name: demo
        run: moon run examples/demo

      # 耗时基线：CI 里不求数字好看，只求这条命令能跑通（回归了会被发现）。
      - name: bench
        run: moon run examples/bench --release

      # 验收数字必须能在 CI 里复算：Python 只算解析式，不 import 几何库。
      # 只跑 oracle.py 是没意义的（它打印完就 exit 0），所以这里跑
      # volume_check.mjs：跑 cmd/main --stats 拿实测体积，逐组比阈值。
      - name: volume check
        run: node tools/volume_check.mjs

      # 「可打印保证」的边界：正常输入必须闭合；半空间、与域面相切、被裁剪、
      # 空域必须以非零退出码拒绝；--clip 必须明确声明 watertight=false。
      - name: guard check
        run: node tools/guard_check.mjs
